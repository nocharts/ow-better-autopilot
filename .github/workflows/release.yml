name: Release

# Push a tag like v0.1.0 (matching "version" in manifest.json) to build the mod and publish a release
# with the zip the Outer Wilds mod database and mod manager install from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build BetterAutopilot/BetterAutopilot.csproj -c Release
      - name: Package
        run: |
          cd BetterAutopilot/bin/Release/net48
          zip ../../../../nocharts.BetterAutopilot.zip BetterAutopilot.dll manifest.json default-config.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" nocharts.BetterAutopilot.zip --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" nocharts.BetterAutopilot.zip --clobber
